# The installer. Built from what `pnpm build` leaves: the renderer in dist/ and the main
# process and preload in dist-electron/ — both bundled by Vite, so nothing from
# node_modules is needed at runtime and none of it is packed.
appId: app.kemolate.desktop
productName: Kemolate
copyright: Kemolate

# Where releases are published, and where the installed app looks for the next one
# (electron/updates.ts). A public repository, so the app needs no token to read it;
# the release workflow publishes with GITHUB_TOKEN (.github/workflows/release.yml).
publish:
  provider: github
  owner: azeranex
  repo: kemolate-desktop
  releaseType: release

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!node_modules/**"

# The CUDA process's script, beside the app rather than inside app.asar: it is run by the
# reader's own Python, which cannot read an asar. See electron/cuda.ts.
extraResources:
  - from: electron/cuda/kemolate_cuda.py
    to: cuda/kemolate_cuda.py
  # The workspace database's migrations, applied at every launch — read as files
  # by Drizzle's migrator, so beside the app rather than inside app.asar. See
  # electron/database.ts.
  - from: server/database/migrations
    to: migrations
    filter:
      - "**/migration.sql"
  # Kemolate for Claude Desktop — the MCP bridge, packed by `pnpm build` (mcpb/vite.config.ts).
  # Beside the app so Settings › Agents can hand the file to Claude Desktop. See electron/mcp.ts.
  - from: out/mcpb/kemolate.mcpb
    to: kemolate.mcpb

# A .kemolate double-clicked opens in the app — see electron/opening.ts, which takes
# the path from the command line, or from a second launch through the single-instance lock.
#
# `name` is the ProgID the NSIS script registers under HKCU\Software\Classes, and
# `description` the type Explorer shows. They were one string, "Kemolate project",
# which made a ProgID with a space in it — something Windows asks programs not to
# do. An upgrade's uninstall step takes the old key away with it.
fileAssociations:
  - ext: kemolate
    name: Kemolate.Project
    description: Kemolate project
    role: Editor

win:
  target: nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target: dmg
  category: public.app-category.graphics-design
  icon: build/icon.png

linux:
  target: AppImage
  icon: build/icon.png
