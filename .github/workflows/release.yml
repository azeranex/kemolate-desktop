# A release: push a tag `v<version>` — the version in package.json — and this
# checks, builds the Windows installer and publishes it to a GitHub Release with
# `latest.yml` and the blockmap. Installed copies find it there on their own
# (electron/updates.ts, electron-updater) and offer "Restart to update".
#
#   1. bump "version" in package.json, commit
#   2. git tag v0.2.0 && git push origin main v0.2.0
#
# The tag has to match package.json: the updater compares the version inside
# the app with the one in latest.yml, and a mismatch is a release nobody's copy
# would ever take — or one that offers itself forever.
#
# Unsigned for now: SmartScreen warns on a first install from the Release page;
# updates are not warned about. See electron/updates.ts.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  # To create the Release and upload its files.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: The tag is the version in package.json
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($want)."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # `pnpm build` is vue-tsc and Vite: the renderer into dist/, the main
      # process and preload into dist-electron/ (emptied first, see vite.config.ts),
      # and the Claude Desktop bundle into out/mcpb/ (mcpb/vite.config.ts).
      - run: pnpm build

      # The Release made here, before electron-builder runs, and not by it.
      # electron-builder uploads its files in parallel, and each upload that
      # finds no release creates one: v0.1.0 came out as two releases on one
      # tag — the blockmap in one, the installer and latest.yml in the other —
      # and the updater reads whichever GitHub calls latest. Given one that
      # exists, every upload goes into it.
      - name: Create the release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the installer
        run: pnpm exec electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # And checked, so a release missing what the updater reads fails here
      # rather than in every installed copy.
      - name: The release has what the updater reads
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for want in latest.yml "Kemolate-Setup-${GITHUB_REF_NAME#v}.exe" "Kemolate-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"; do
            echo "$assets" | grep -qxF "$want" || { echo "::error::$want is missing from the release."; exit 1; }
          done
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          [ "$count" = 1 ] || { echo "::error::$count releases on $GITHUB_REF_NAME — expected one."; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
